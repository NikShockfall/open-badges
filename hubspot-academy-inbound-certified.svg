<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title desc">
  <title id="title">HubSpot Academy Inbound Certified badge</title>
  <desc id="desc">Circular HubSpot Academy badge with a blue ring, orange academy emblem, and dark blue ribbon reading Inbound Certified.</desc>

  <defs>
    <path id="hubArc" d="M 250 470 A 350 350 0 0 1 1150 470"/>
    <path id="hubArcLower" d="M 250 470 A 350 350 0 0 1 1150 470"/>
    <linearGradient id="outerRing" x1="0" x2="1">
      <stop offset="0%" stop-color="#384d5d"/>
      <stop offset="100%" stop-color="#2d3d4d"/>
    </linearGradient>
    <linearGradient id="badgeFill" x1="0" x2="1">
      <stop offset="0%" stop-color="#f4f0eb"/>
      <stop offset="100%" stop-color="#e7e1d8"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#3d5369"/>
      <stop offset="100%" stop-color="#2b3d4e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="1200" fill="#efefee"/>

  <g filter="url(#softShadow)">
    <g transform="translate(0,0)">
      <circle cx="700" cy="500" r="392" fill="url(#outerRing)"/>
      <circle cx="700" cy="500" r="349" fill="#f3f1ed" opacity="0.25"/>

      <path d="M 473 420 A 260 260 0 0 1 927 420" fill="none" stroke="#2a3d4d" stroke-width="16" opacity="0.8"/>

      <g font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#2f4455">
        <text font-size="160" letter-spacing="-6">
          <textPath href="#hubArc" startOffset="50%" text-anchor="middle">HubSpot Academy</textPath>
        </text>
      </g>

      <circle cx="700" cy="520" r="250" fill="url(#badgeFill)"/>
      <circle cx="700" cy="520" r="247" fill="none" stroke="#f7e8dc" stroke-width="2" opacity="0.7"/>

      <circle cx="700" cy="520" r="210" fill="none" stroke="#f58a5d" stroke-width="26"/>
      <circle cx="700" cy="520" r="126" fill="#f5efe9"/>

      <path d="M 653 520 A 47 47 0 1 1 747 520" fill="none" stroke="#f7bf9d" stroke-width="18" stroke-linecap="round"/>
      <path d="M 600 505 A 120 120 0 1 1 800 505" fill="none" stroke="#f28a5b" stroke-width="18" stroke-linecap="round" opacity="0.9"/>

      <g transform="translate(700 520)">
        <path d="M -88 0 A 88 88 0 0 1 88 0" fill="none" stroke="#ea6b49" stroke-width="46" stroke-linecap="round"/>
        <path d="M -55 0 A 55 55 0 0 1 55 0" fill="none" stroke="#f5efe9" stroke-width="38" stroke-linecap="round"/>
        <path d="M -46 -6 L 0 -46 L 46 -6 L 0 34 Z" fill="#f15d3d" opacity="0.95"/>
        <path d="M -18 -8 L 0 -18 L 18 -8 L 0 18 Z" fill="#f9f7f3"/>
      </g>

      <g aria-label="small icon" transform="translate(700 485)">
        <circle cx="0" cy="0" r="15" fill="#f58d5d"/>
        <circle cx="0" cy="0" r="7" fill="#f8f0e8"/>
      </g>

      <g transform="translate(700 865)">
        <path d="M -460 0 L 460 0 L 430 92 L -430 92 Z" fill="url(#ribbonGrad)"/>
        <path d="M -470 0 L 470 0 L 440 110 L -440 110 Z" fill="none" stroke="#2b3d4e" stroke-width="5" opacity="0.7"/>
        <text x="0" y="60" text-anchor="middle" fill="#f2f3f3" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="700" letter-spacing="-3">INBOUND CERTIFIED</text>
      </g>
    </g>
  </g>
</svg>
