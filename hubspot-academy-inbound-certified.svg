<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="title desc">
  <title id="title">HubSpot Academy Inbound Certified</title>
  <desc id="desc">A circular certification badge with a HubSpot-inspired emblem and ribbon banner.</desc>
  <defs>
    <linearGradient id="ringGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#2a3c4e"/>
      <stop offset="100%" stop-color="#465a6f"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8f6f1"/>
      <stop offset="100%" stop-color="#f0efe9"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#374d5d"/>
      <stop offset="100%" stop-color="#2d3d4c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1400" height="1200" fill="#efefee"/>

  <g filter="url(#shadow)">
    <g transform="translate(700,610)">
      <path d="M -420 175 A 420 420 0 0 1 420 175 L 410 205 A 390 390 0 0 0 -410 205 Z" fill="url(#ringGrad)"/>
      <path d="M -400 145 A 400 400 0 0 1 400 145 L 385 175 A 375 375 0 0 0 -385 175 Z" fill="#2d4050" opacity="0.65"/>

      <circle cx="0" cy="0" r="330" fill="url(#innerGrad)"/>
      <circle cx="0" cy="0" r="290" fill="none" stroke="#f6a47d" stroke-width="18"/>

      <path d="M -270 0 A 270 270 0 0 1 270 0 L 210 0 A 210 210 0 0 0 -210 0 Z" fill="#f4f0eb"/>
      <path d="M -270 0 A 270 270 0 0 1 270 0 L 210 0 A 210 210 0 0 0 -210 0 Z" fill="none" stroke="#e7dcbf" stroke-width="2"/>

      <g transform="translate(0,0)">
        <circle cx="0" cy="0" r="135" fill="#f8f6f3"/>
        <path d="M -92 0 A 92 92 0 0 1 92 0 L 62 0 A 62 62 0 0 0 -62 0 Z" fill="#ef8a5d"/>
        <path d="M -92 0 A 92 92 0 0 1 92 0 L 62 0 A 62 62 0 0 0 -62 0 Z" transform="rotate(180)" fill="#f38c57"/>

        <g transform="translate(0,0)">
          <path d="M -80 0 L 0 -80 L 80 0 L 0 80 Z" fill="#ee6b52" opacity="0.9"/>
          <path d="M -30 0 L 0 -30 L 30 0 L 0 30 Z" fill="#f9faf9" opacity="0.9"/>
        </g>

        <path d="M 13 0 A 40 40 0 1 1 -13 0" fill="none" stroke="#f8f6f3" stroke-width="18" stroke-linecap="round"/>
        <path d="M -68 0 A 68 68 0 1 1 68 0" fill="none" stroke="#ffb98d" stroke-width="15" stroke-linecap="round" opacity="0.8"/>
      </g>

      <g aria-label="HubSpot" fill="#2d3c4d" font-family="Arial, Helvetica, sans-serif" font-weight="700">
        <text x="0" y="-122" font-size="128" text-anchor="middle" letter-spacing="-5">HubSpot</text>
      </g>

      <g aria-label="Academy" fill="#2d3c4d" font-family="Arial, Helvetica, sans-serif" font-weight="700">
        <text x="0" y="-30" font-size="84" text-anchor="middle">Academy</text>
      </g>

      <g transform="translate(0, 190)">
        <path d="M -420 0 L 420 0 L 390 88 L -390 88 Z" fill="url(#bannerGrad)"/>
        <path d="M -420 0 L 420 0 L 390 88 L -390 88 Z" fill="none" stroke="#2a3d4c" stroke-width="5"/>
        <text x="0" y="60" text-anchor="middle" fill="#f3f5f6" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" letter-spacing="-4">INBOUND CERTIFIED</text>
      </g>
    </g>
  </g>
</svg>
